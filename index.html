<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>찾아가는 청년센터 x배너 투표</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div>
      <h1 class="title">찾아가는 청년센터 x배너 투표</h1>
      <p class="status" id="status">투표 현황을 불러오는 중…</p>
    </div>
    <button class="admin-btn" id="adminBtn" type="button">관리자 결과보기</button>
  </header>

  <main class="grid" id="grid">
    <!-- 카드 4개는 script.js에서 생성 -->
  </main>

  <div class="modal" id="modal" aria-hidden="true">
    <button class="modal-close" id="modalClose" aria-label="닫기">&times;</button>
    <div class="modal-body">
      <img id="modalImg" src="" alt="">
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
